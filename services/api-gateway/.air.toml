root = "."
tmp_dir = ".air"

[build]
  bin = "./tmp/main"
  cmd = "go build -o ./tmp/main ./cmd/..."
  delay = 1000
  exclude_dir = ["tmp", "vendor", ".git", "node_modules"]
  exclude_file = []
  exclude_regex = ["_test.go"]
  exclude_unchanged = true
  follow_symlink = false
  include_ext = ["go", "toml", "yaml"]
  kill_delay = "0s"
  log = "build-errors.log"
  send_interrupt = false
  stop_on_error = true

[color]
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  time = false

[misc]
  clean_on_exit = true
