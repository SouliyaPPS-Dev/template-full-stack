name: mobile_flutter
description: Full-stack mobile app with Flutter
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: "^3.6.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  flutter_riverpod: ^3.3.0
  go_router: ^17.3.0
  shared_preferences: ^2.3.0
  intl: ^0.20.0
  cached_network_image: ^3.4.1
  flutter_secure_storage: ^10.3.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
