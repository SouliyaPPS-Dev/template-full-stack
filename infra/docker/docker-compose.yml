services:
  api-gateway:
    build:
      context: ../../services/api-gateway
      dockerfile: ../../infra/docker/Dockerfile.go
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DATABASE_URL=postgresql://app_user:password@postgres:5432/app_main
    depends_on:
      - postgres
      - redis

  auth-service:
    build:
      context: ../../services/auth-service
      dockerfile: ../../infra/docker/Dockerfile.python
    ports:
      - "8081:8081"
    environment:
      - DATABASE_URL=postgresql://app_user:password@postgres:5432/app_main
      - JWT_SECRET=change-me-in-production
    depends_on:
      - postgres

  data-service:
    build:
      context: ../../services/data-service
      dockerfile: ../../infra/docker/Dockerfile.rust
    ports:
      - "3002:3002"
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: app_main
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../../database/postgres/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  web-user:
    build:
      context: ../../apps/web-user
      dockerfile: ../../infra/docker/Dockerfile.bun
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8080

  web-admin:
    build:
      context: ../../apps/web-admin
      dockerfile: ../../infra/docker/Dockerfile.bun
    ports:
      - "3001:3001"
    environment:
      - VITE_API_URL=http://localhost:8080

volumes:
  pgdata:
